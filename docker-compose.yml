name: papergraph

services:
  db:
    image: pgvector/pgvector:pg16
    # Parallel index builds share maintenance_work_mem through /dev/shm. Docker's
    # 64 MB default makes the HNSW build fail ("could not resize shared memory
    # segment"), so leave room for the 2 GB that `make embed` asks for.
    shm_size: 3gb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-papergraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-papergraph}
      POSTGRES_DB: ${POSTGRES_DB:-papergraph}
    ports:
      - "5432:5432"   # exposed so you can connect from the host (psql, notebooks)
    volumes:
      - pgdata:/var/lib/postgresql/data          # data survives `docker compose down`
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # "healthy" only once Postgres accepts connections, not merely when the container starts.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      # Inside the compose network, the database's hostname is its service name.
      DATABASE_URL: postgresql://${POSTGRES_USER:-papergraph}:${POSTGRES_PASSWORD:-papergraph}@db:5432/${POSTGRES_DB:-papergraph}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy   # wait for the healthcheck, not just container start

  # One-off batch job: `make ingest`. Same image as the api, different command.
  # The "jobs" profile keeps it out of `docker compose up`.
  ingest:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    profiles: ["jobs"]
    command: ["python", "-m", "papergraph.ingest.load"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-papergraph}:${POSTGRES_PASSWORD:-papergraph}@db:5432/${POSTGRES_DB:-papergraph}
    volumes:
      - ./data:/app/data:ro   # the 5 GB snapshot is mounted, never copied into the image
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
