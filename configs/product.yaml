# The full product pipeline as served by src/papergraph/search.py: hybrid
# (BM25 with max_df 0.2 + Qwen3-Embedding-0.6B with weight 2, RRF), no reranker (M4b).
# Keep in sync with search.HYBRID. The previous product (bge-small hybrid ->
# mxbai-rerank-xsmall @20) is reports/runs/20261103T170554Z_product-maxdf01.
name: product-qwen3-hybrid
retriever:
  kind: hybrid
  params:
    k_rrf: 60
    candidates: 100
    retrievers:
      - kind: bm25
        params: {k1: 1.2, b: 0.75, max_df: 0.2}
      - kind: dense
        params: {model: qwen3-0.6b, query_instruction: true, ef_search: 100}
        weight: 2
depth: 100
