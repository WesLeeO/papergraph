[project]
name = "papergraph"
version = "0.1.0"
description = "Find research papers that match your interests: hybrid retrieval, citation graph, reranking, rigorous evals."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.5.1",
    "pyyaml>=6.0.3",
    "numpy>=2.5.4",
    "httpx>=0.28.1",
]

[dependency-groups]
bench = [
    "huggingface-hub>=0.34",  # HfFileSystem; capped <1.0 by transformers 4.x (embed)
    "pyarrow>=26.0.1",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0.12.20261103",
]
embed = [
    "adapters==1.3.0",
    "sentence-transformers>=5.7,<6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papergraph"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["papergraph"]

# The embed and bench groups (torch, sentence-transformers, pyarrow,
# huggingface_hub) aren't installed in CI or the api image, and pgvector ships
# no type hints.
[[tool.mypy.overrides]]
module = ["sentence_transformers", "torch", "pgvector.*", "pyarrow.*", "huggingface_hub", "adapters", "transformers"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
