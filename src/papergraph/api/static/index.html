<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperGraph</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --line: #e4e4e0; --accent: #3d5afe; --accent-soft: #eef0ff; --ok: #1b873f; --warn: #b26a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --panel: #1d1d20; --text: #ececee; --muted: #9a9aa2;
      --line: #2e2e33; --accent: #8c9eff; --accent-soft: #23263a; --ok: #57c27a; --warn: #e0a54a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 28px 16px 60px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: 24px; margin: 0; letter-spacing: -0.02em; }
  .tagline { color: var(--muted); font-size: 14px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tab { border: 1px solid var(--line); background: var(--panel); color: var(--text);
         padding: 8px 14px; border-radius: 999px; cursor: pointer; font-size: 14px; }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type=text], textarea, input[type=number] {
    font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; }
  input[type=text] { flex: 1; min-width: 220px; }
  textarea { width: 100%; min-height: 72px; resize: vertical; }
  input[type=number] { width: 96px; }
  button.go { font: inherit; background: var(--accent); color: #fff; border: 0; border-radius: 10px;
              padding: 10px 18px; cursor: pointer; }
  button.go:disabled { opacity: .55; cursor: default; }
  .filters { margin-top: 12px; display: grid; gap: 10px; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 13px;
          cursor: pointer; user-select: none; background: var(--panel); }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .meta { color: var(--muted); font-size: 13px; margin: 14px 2px 8px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-top: 10px; }
  .card h3 { margin: 0 0 4px; font-size: 16px; line-height: 1.35; }
  .card h3 a { color: var(--text); text-decoration: none; }
  .card h3 a:hover { color: var(--accent); }
  .byline { color: var(--muted); font-size: 13px; }
  .badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px;
           background: var(--accent-soft); color: var(--accent); margin-left: 6px; }
  .abstract { margin-top: 8px; font-size: 14px; }
  .more { color: var(--accent); cursor: pointer; font-size: 13px; }
  .rank { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
  .steps { margin-top: 14px; display: grid; gap: 6px; }
  .step { font-size: 13px; border-left: 3px solid var(--line); padding: 4px 10px; color: var(--muted); }
  .step.call { border-color: var(--accent); color: var(--text); }
  .step.err { border-color: var(--warn); color: var(--warn); }
  .step code { font-size: 12.5px; }
  .answer { margin-top: 16px; }
  .answer a.cite { color: var(--accent); text-decoration: none; font-weight: 600; }
  .answer ol, .answer ul { padding-left: 22px; }
  .status { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line);
             border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite;
             vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none; }
  .note { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  .warn { color: var(--warn); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>PaperGraph</h1>
    <span class="tagline" id="tagline">Find ML papers that match your interests</span>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="search">Search</button>
    <button class="tab" data-tab="agent">Research agent</button>
  </div>

  <!-- Search -->
  <section id="tab-search">
    <div class="panel">
      <form id="search-form" class="row">
        <input type="text" id="q" placeholder="Describe your interest, e.g. contrastive learning for medical images" autocomplete="off" required>
        <button class="go" id="search-btn">Search</button>
      </form>
      <div class="filters">
        <div class="row" style="align-items:center">
          <div><div class="label">From year</div><input type="number" id="year-from" min="1990" max="2100" placeholder="any"></div>
          <div><div class="label">To year</div><input type="number" id="year-to" min="1990" max="2100" placeholder="any"></div>
        </div>
        <div><div class="label">Venue (papers with a detected venue)</div><div class="chips" id="venues"></div></div>
        <div><div class="label">Category</div><div class="chips" id="categories"></div></div>
      </div>
    </div>
    <div class="meta" id="search-meta"></div>
    <div id="results"></div>
  </section>

  <!-- Agent -->
  <section id="tab-agent" class="hidden">
    <div class="panel">
      <textarea id="question" placeholder="Ask a research question, e.g. Which methods reduce hallucination in retrieval-augmented generation, and how do they compare?"></textarea>
      <div class="row" style="margin-top:8px; align-items:center">
        <button class="go" id="agent-btn">Research</button>
        <label class="note" style="margin:0"><input type="checkbox" id="think"> let the model reason first (slower, often better)</label>
      </div>
      <div class="note">The agent runs a local open model (Qwen3 via Ollama). It plans searches, reads results and decides what to look up next, then writes a cited answer. Expect 30 s to 2 min.</div>
    </div>
    <div class="status" id="agent-status"></div>
    <div class="steps" id="steps"></div>
    <div class="answer" id="answer"></div>
    <div id="agent-papers"></div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ---------- tabs ----------
document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("active", x === t));
  $("tab-search").classList.toggle("hidden", t.dataset.tab !== "search");
  $("tab-agent").classList.toggle("hidden", t.dataset.tab !== "agent");
}));

// ---------- paper cards ----------
function paperCard(p, rank) {
  const year = (p.published || "").slice(0, 4);
  const authors = p.authors.slice(0, 4).join(", ") + (p.authors.length > 4 ? " et al." : "");
  const venue = p.venue ? `<span class="badge">${esc(p.venue)} ${esc(p.venue_year || "")}</span>` : "";
  const short = p.abstract.length > 320 ? p.abstract.slice(0, 320) + "…" : p.abstract;
  const el = document.createElement("div");
  el.className = "card";
  el.id = "paper-" + p.id;
  el.innerHTML = `
    <h3>${rank ? `<span class="rank">${rank}.</span>` : ""}<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>${venue}</h3>
    <div class="byline">${esc(authors)}${year ? " · " + esc(year) : ""} · ${esc(p.id)}${p.categories.length ? " · " + esc(p.categories.slice(0, 3).join(", ")) : ""}</div>
    <div class="abstract"><span class="text">${esc(short)}</span>
      ${p.abstract.length > 320 ? '<span class="more">more</span>' : ""}</div>`;
  const more = el.querySelector(".more");
  if (more) more.addEventListener("click", () => {
    el.querySelector(".text").textContent = p.abstract;
    more.remove();
  });
  return el;
}

// ---------- filters ----------
const selected = { venues: new Set(), categories: new Set() };
function chip(container, name, set, label) {
  const c = document.createElement("span");
  c.className = "chip";
  c.textContent = label || name;
  c.addEventListener("click", () => {
    set.has(name) ? set.delete(name) : set.add(name);
    c.classList.toggle("on", set.has(name));
  });
  container.appendChild(c);
}
fetch("/api/meta").then((r) => r.json()).then((m) => {
  m.venues.slice(0, 17).forEach((v) => chip($("venues"), v.name, selected.venues, `${v.name} (${v.count.toLocaleString()})`));
  m.categories.forEach((c) => chip($("categories"), c, selected.categories));
  $("tagline").textContent = `Find ML papers that match your interests · ${m.papers.toLocaleString()} arXiv papers up to ${m.latest || "?"}`;
}).catch(() => { $("tagline").textContent = "Database unavailable"; });

// ---------- search ----------
$("search-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = $("q").value.trim();
  if (!q) return;
  const params = new URLSearchParams({ q, k: 15 });
  if ($("year-from").value) params.set("year_from", $("year-from").value);
  if ($("year-to").value) params.set("year_to", $("year-to").value);
  if (selected.venues.size) params.set("venues", [...selected.venues].join(","));
  if (selected.categories.size) params.set("categories", [...selected.categories].join(","));
  $("search-btn").disabled = true;
  $("search-meta").innerHTML = '<span class="spinner"></span>Searching…';
  $("results").innerHTML = "";
  try {
    const r = await fetch("/api/search?" + params);
    if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
    const data = await r.json();
    $("search-meta").textContent = `${data.papers.length} papers · ${data.ms} ms · hybrid BM25 + dense retrieval, cross-encoder reranking`;
    data.papers.forEach((p, i) => $("results").appendChild(paperCard(p, i + 1)));
    if (!data.papers.length) $("search-meta").textContent = "No papers found. Try fewer filters.";
  } catch (err) {
    $("search-meta").innerHTML = `<span class="warn">Search failed: ${esc(err.message)}</span>`;
  } finally {
    $("search-btn").disabled = false;
  }
});

// ---------- agent ----------
function renderAnswer(md) {
  // Escape first, then add the little markdown the model uses.
  const lines = esc(md).split("\n");
  let html = "", list = null;
  const inline = (s) => s
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([A-Za-z0-9.\-\/]+)\]/g, '<a class="cite" href="#paper-$1">[$1]</a>');
  for (const raw of lines) {
    const line = raw.trim();
    const ol = line.match(/^\d+[.)]\s+(.*)/), ul = line.match(/^[-*]\s+(.*)/);
    if (ol || ul) {
      const tag = ol ? "ol" : "ul";
      if (list !== tag) { if (list) html += `</${list}>`; html += `<${tag}>`; list = tag; }
      html += `<li>${inline((ol || ul)[1])}</li>`;
      continue;
    }
    if (list) { html += `</${list}>`; list = null; }
    if (line.startsWith("#")) html += `<h4>${inline(line.replace(/^#+\s*/, ""))}</h4>`;
    else if (line) html += `<p>${inline(line)}</p>`;
  }
  if (list) html += `</${list}>`;
  return html;
}

let source = null, timer = null;
$("agent-btn").addEventListener("click", () => {
  const q = $("question").value.trim();
  if (q.length < 3) return;
  if (source) source.close();
  $("steps").innerHTML = ""; $("answer").innerHTML = ""; $("agent-papers").innerHTML = "";
  $("agent-btn").disabled = true;
  const t0 = Date.now();
  const tick = (msg) => { $("agent-status").innerHTML = `<span class="spinner"></span>${esc(msg)} · ${Math.round((Date.now() - t0) / 1000)} s`; };
  let phase = "Thinking about how to search";
  tick(phase);
  timer = setInterval(() => tick(phase), 1000);
  const stop = (msg) => { clearInterval(timer); $("agent-status").innerHTML = msg; $("agent-btn").disabled = false; source && source.close(); };

  source = new EventSource("/api/agent?" + new URLSearchParams({ q, think: $("think").checked }));
  source.onmessage = (msg) => {
    const ev = JSON.parse(msg.data);
    const step = document.createElement("div");
    if (ev.type === "tool_call") {
      step.className = "step call";
      step.innerHTML = `<strong>Step ${ev.step}</strong> · ${esc(ev.name)} <code>${esc(JSON.stringify(ev.arguments))}</code>`;
      $("steps").appendChild(step);
      phase = `Running ${ev.name}`;
    } else if (ev.type === "tool_result") {
      step.className = ev.error ? "step err" : "step";
      step.textContent = ev.error ? ev.error : `→ ${ev.n_papers} papers: ` + ev.papers.slice(0, 3).map((p) => p.title).join(" · ") + (ev.n_papers > 3 ? " …" : "");
      $("steps").appendChild(step);
      phase = "Reading results and deciding what to do next";
    } else if (ev.type === "nudge") {
      step.className = "step";
      step.textContent = "Guardrail: only one search so far, asking the agent to cover the other aspects first.";
      $("steps").appendChild(step);
      phase = "Planning more searches";
    } else if (ev.type === "thinking") {
      step.className = "step";
      step.textContent = "Reasoning: " + ev.text.slice(0, 300) + (ev.text.length > 300 ? "…" : "");
      $("steps").appendChild(step);
    } else if (ev.type === "final") {
      $("answer").innerHTML = renderAnswer(ev.answer);
      ev.papers.forEach((p, i) => $("agent-papers").appendChild(paperCard(p, i + 1)));
      let note = `Done in ${ev.seconds} s · ${ev.steps} tool steps · ${ev.papers.length} cited papers verified`;
      if (ev.unverified_ids.length) note += ` · <span class="warn">ignored unverified ids: ${esc(ev.unverified_ids.join(", "))}</span>`;
      stop(note);
    } else if (ev.type === "error") {
      stop(`<span class="warn">Agent error: ${esc(ev.message)}</span>`);
    } else if (ev.type === "done") {
      if ($("agent-btn").disabled) stop("Stopped.");
    }
  };
  source.onerror = () => { if ($("agent-btn").disabled) stop('<span class="warn">Connection lost.</span>'); };
});
</script>
</body>
</html>
